w:'#ffffff',b:'#2a4f9a',B:'#5aa0ff',n:'#5a3a20',N:'#9a6a3a'};
function sprite(rows){const h=rows.length,w=Math.max(...rows.map(r=>r.length));const c=mk(w,h),x=c.getContext('2d');
 rows.forEach((r,j)=>{for(let i=0;i<r.length;i++){const col=PAL[r[i]];if(col){x.fillStyle=col;x.fillRect(i,j,1,1);}}});
 const o=mk(w,h),ox=o.getContext('2d');ox.drawImage(c,0,0);ox.globalCompositeOperation='source-in';ox.fillStyle='#fff';ox.fillRect(0,0,w,h);c.white=o;return c;}

"A010101111101101|B110101110101110|C011100100100011|D110101101101110|E111100110100111|F111100110100100|G011100101101011|H101101111101101|I111010010010111|J001001001101010|K101101110101101|L100100100100111|M101111111101101|N110101101101101|O010101101101010|P110101110100100|Q010101101110011|R110101110101101|S011100010001110|T111010010010010|U101101101101111|V101101101101010|W101101111111101|X101101010101101|Y101101010010010|Z111001010100111|0111101101101111|1010110010010111|2110001010100111|3110001010001110|4101101111001001|5111100110001110|6011100111101111|7111001010010010|8111101111101111|9111101111001110|.000000000000010|,000000000010100|:000010000010000|!010010010000010|?110001010000010|-000000111000000|/001001010100100|%101001010100101|'010010000000000|(010100100100010|)010001001001010|+000010111010000|>100010001010100|<001010100010001|_000000000000111|[110100100100110|]011001001001011|=000111000111000|Ñ111000110101101|¡010000010010010|¿010000010100011|*000101010101000"
 .split('|').forEach(s=>FONT[s[0]]=s.slice(1));
function norm(s){return String(s).toUpperCase().replace(/Ñ/g,'\u0001').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/\u0001/g,'Ñ');}
function drawStr(s,x,y,col,sc){ctx.fillStyle=col;for(let i=0;i<s.length;i++){let g=FONT[s[i]];if(s[i]==='Ñ'){g=FONT.N;ctx.fillRect(x+i*4*sc,y-2*sc,3*sc,sc);}if(!g)continue;for(let k=0;k<15;k++)if(g.charCodeAt(k)===49)ctx.fillRect(x+i*4*sc+(k%3)*sc,y+((k/3)|0)*sc,sc,sc);}}
function text(s,x,y,col='#fff',sc=1,al='left',sh='#000'){s=norm(s);const w=s.length*4*sc-sc;if(al==='center')x-=w/2;else if(al==='right')x-=w;x=Math.round(x);y=Math.round(y);if(sh)drawStr(s,x+sc,y+sc,sh,sc);drawStr(s,x,y,col,sc);}

// ===================== TILES =====================

const F=(x,c,a,b,w=1,h=1)=>{x.fillStyle=c;x.fillRect(a,b,w,h);};
function T16(fn,seed){const c=mk(TS,TS),x=c.getContext('2d');fn(x,mulberry(seed));return c;}
function speck(x,R,cols,n){for(let i=0;i<n;i++)F(x,cols[R()*cols.length|0],R()*16|0,R()*16|0);}
const TL={};

 if(v===1)[[2,2],[13,2],[2,13],[13,13]].forEach(p=>{F(x,'#454a50',p[0],p[1]);F(x,'#16181a',p[0]+1,p[1]+1);});
 if(v===2){let cx=R()*16|0,cy=0;for(let i=0;i<16;i++){F(x,'#141517',cx,cy);cy++;cx+=R()<.3?-1:R()<.5?1:0;cx=clamp(cx,1,14);}}
 if(v===3)for(let i=0;i<18;i++)F(x,R()<.5?'#3a2a1e':'#2e221a',5+R()*6|0,5+R()*6|0);},v*31+1));
TL.dirt=[0,1].map(v=>T16((x,R)=>{F(x,'#29241c',0,0,16,16);speck(x,R,['#332c21','#1f1b15','#3d3529','#24201a'],40);if(v)for(let i=0;i<3;i++){const a=R()*13|0,b=R()*13|0;F(x,'#4a453c',a,b,2,2);F(x,'#1a1712',a+1,b+2,2,1);}},v*7+50));
TL.creep=[0,1].map(v=>T16((x,R)=>{for(let i=0;i<9;i++){const a=R()*13|0,b=R()*13|0,w=2+(R()*4|0);F(x,'rgba(70,20,90,0.45)',a,b,w,2+(R()*3|0));}for(let i=0;i<3;i++)F(x,'rgba(110,40,140,0.6)',R()*15|0,R()*15|0,2,1);if(R()<.6)F(x,'#a65ad6',R()*15|0,R()*15|0);},v*13+70));
TL.wall=T16((x,R)=>{F(x,'#6a7480',0,0,16,16);speck(x,R,['#727c88','#626b76'],16);F(x,'#8d97a3',0,0,16,1);F(x,'#7c8692',0,1,1,15);F(x,'#4e5660',15,0,1,16);F(x,'#4e5660',0,15,16,1);F(x,'#5a636e',4,4,8,8);F(x,'#6a7480',5,5,6,6);},90);
TL.wallF=T16((x,R)=>{F(x,'#6a7480',0,0,16,11);speck(x,R,['#727c88','#626b76'],10);F(x,'#8d97a3',0,0,16,1);F(x,'#4e5660',15,0,1,11);F(x,'#3a414a',0,11,16,1);F(x,'#262b31',0,12,16,4);for(let i=0;i<16;i+=4)F(x,'#6b5a1a',i,13,2,1);F(x,'#15181b',0,15,16,1);},91);

 [[1,1],[14,1],[1,13],[14,13]].forEach(p=>F(x,'#8a8a8a',p[0],p[1]));F(x,'#24160a',1,14,14,2);if(v)for(let i=0;i<10;i++)F(x,'#1a0f06',3+R()*10|0,3+R()*9|0,1,2);},v+100));
// ===================== AMBIENTES =====================
function disc(x,cx,cy,r,c){x.fillStyle=c;for(let dy=-r;dy<=r;dy++)for(let dx=-r;dx<=r;dx++)if(dx*dx+dy*dy<=r*r+r*0.6)x.fillRect(cx+dx,cy+dy,1,1);}
function walk(x,R,c,n,sx,sy){let a=sx??(R()*16|0),b=sy??(R()*16|0);for(let i=0;i<n;i++){F(x,c,a,b);if(R()<.5)a+=R()<.5?-1:1;else b+=R()<.5?-1:1;a=clamp(a,0,15);b=clamp(b,0,15);}}
function floorStyle(x,R,st,v){
 switch(st){
 case'grass':F(x,'#1d3516',0,0,16,16);speck(x,R,['#25421c','#172c12','#2d5222'],40);for(let i=0;i<6;i++){const a=R()*15|0,b=1+R()*14|0;F(x,'#3f7a2a',a,b-1,1,2);}
  if(v===1)for(let i=0;i<3;i++)F(x,R()<.5?'#d8d04a':'#d86aa0',R()*15|0,R()*15|0);if(v===2)for(let i=0;i<8;i++)F(x,'#4a3a1a',R()*15|0,R()*15|0,2,1);if(v===3)for(let i=0;i<4;i++)F(x,'#54a83a',R()*14|0,R()*14|0,1,3);break;
 case'mud':F(x,'#3a3020',0,0,16,16);speck(x,R,['#443826','#30281a','#4a3e2a'],40);if(v)F(x,'#1a160d',3+R()*6|0,3+R()*6|0,6,3);break;
 case'grid':F(x,'#1b1e21',0,0,16,16);speck(x,R,['#202326','#17191c'],12);F(x,'#272b2f',0,0,16,1);F(x,'#272b2f',0,8,16,1);F(x,'#272b2f',0,0,1,16);F(x,'#272b2f',8,0,1,16);
  if(v===1){F(x,'#3a4046',2,2);F(x,'#3a4046',10,10);}if(v===2)for(let i=0;i<16;i+=4){F(x,'#8a7010',i,12,2,4);F(x,'#111',i+2,12,2,4);}if(v===3){F(x,'#0e1012',4,4,8,8);for(let j=5;j<12;j+=2)F(x,'#2a2e33',4,j,8,1);}break;
 case'tiles':for(let j=0;j<16;j+=8)for(let i=0;i<16;i+=8)F(x,((i+j)/8)%2?'#25282c':'#1f2225',i,j,8,8);speck(x,R,['#2a2d31','#1a1c1f'],10);if(v)walk(x,R,'#141518',12);break;
 case'gravel':F(x,'#2a2420',0,0,16,16);speck(x,R,['#352d27','#1e1a17','#40362e'],45);if(v)for(let i=0;i<3;i++){const a=R()*13|0,b=R()*13|0;F(x,'#4d4238',a,b,2,2);F(x,'#1a1612',a+1,b+2,2,1);}break;
 case'crystal':F(x,'#2a2420',0,0,16,16);speck(x,R,['#352d27','#1e1a17'],35);for(let i=0;i<2+v;i++){const a=1+R()*12|0,b=1+R()*11|0;F(x,'#2a6aa0',a,b,2,3);F(x,'#7fd0ff',a,b,1,2);}break;
 case'hull':F(x,'#1e1a24',0,0,16,16);F(x,'#2a2433',0,0,16,1);F(x,'#2a2433',0,0,1,16);F(x,'#14111a',0,15,16,1);F(x,'#14111a',15,0,1,16);F(x,'#352c40',4,4,2,2);F(x,'#352c40',10,10,2,2);
  if(v===1){F(x,'#2a7d14',7,7,2,2);F(x,'#6dff4a',7,7,1,1);}if(v===2)for(let i=2;i<14;i++)F(x,'#262030',i,i);if(v===3)speck(x,R,['#2a2433'],10);break;
 case'scorch':F(x,'#1a1714',0,0,16,16);speck(x,R,['#2b2520','#110f0d','#241f1b'],45);if(v)for(let i=0;i<3;i++)F(x,'#7a3a1a',R()*15|0,R()*15|0);break;
 case'flesh':F(x,'#2a1230',0,0,16,16);speck(x,R,['#33163a','#22102a'],30);walk(x,R,'#4a1d55',14);if(v===1)F(x,'#a65ad6',R()*14|0,R()*14|0,2,2);if(v===2)walk(x,R,'#5c2774',10);break;
 case'ribs':F(x,'#1f0f25',0,0,16,16);for(let j=1;j<16;j+=5){F(x,'#3a1848',0,j,16,2);F(x,'#4f2060',0,j,16,1);}speck(x,R,['#2a1230'],12);break;
 }

function wallStyle(x,R,st,front){
 const fh=front?11:16;
 switch(st){

 case'rock':F(x,'#6e5b4a',0,0,16,fh);speck(x,R,['#7d6855','#5e4d3f','#86705c'],34);F(x,'#9a8268',0,0,16,1);F(x,'#806a56',0,1,1,fh-1);walk(x,R,'#3a2e24',8);

 case'concrete':F(x,'#5d5d57',0,0,16,fh);speck(x,R,['#66665f','#545450'],16);F(x,'#7a7a72',0,0,16,1);F(x,'#4e4e49',0,fh-1,16,1);F(x,'#52524d',3,3,10,fh-6);

 case'organic':F(x,'#4a1f5a',0,0,16,fh);for(let j=2;j<fh;j+=4)F(x,'#6a3380',0,j,16,1);speck(x,R,['#3a1648','#5a2770'],20);for(let i=0;i<3;i++)F(x,'#2a0f33',R()*14|0,R()*(fh-2)|0,2,2);F(x,'#8c4fa8',0,0,16,1);
  if(front){F(x,'#200a28',0,11,16,5);for(let i=0;i<5;i++)F(x,'#5c2774',R()*16|0,11,1,1+(R()*4|0));}break;
 }

function crateStyle(x,R,st,dmg){

function computeFlow(){
 const w=world.w,h=world.h,N=w*h;if(!flow||flow.length!==N){flow=new Int16Array(N);flowQ=new Int32Array(N);}flow.fill(-1);
 const px=clamp(Math.floor((P.x+P.w/2)/TS),0,w-1),py=clamp(Math.floor((P.y+P.h/2)/TS),0,h-1),q=flowQ,t=world.t;
 let hd=0,tl=0;flow[py*w+px]=0;q[tl++]=py*w+px;
 while(hd<tl){const i=q[hd++],d=flow[i];if(d>=60)continue;const x=i%w,nd=d+1;let j;
  if(x>0){j=i-1;if(flow[j]<0&&!solidT(t[j])){flow[j]=nd;q[tl++]=j;}}
  if(x<w-1){j=i+1;if(flow[j]<0&&!solidT(t[j])){flow[j]=nd;q[tl++]=j;}}
  if(i>=w){j=i-w;if(flow[j]<0&&!solidT(t[j])){flow[j]=nd;q[tl++]=j;}}
  if(i<N-w){j=i+w;if(flow[j]<0&&!solidT(t[j])){flow[j]=nd;q[tl++]=j;}}}
}
function pathDir(e,dx,dy,dd){
 const cx=e.x+e.w/2,cy=e.y+e.h/2;
 if(dd<36||!flow||(dd<100&&los(cx,cy,cx+dx,cy+dy)))return[dx/dd,dy/dd];
 const w=world.w,tx=Math.floor(cx/TS),ty=Math.floor(cy/TS);
 const at=(x,y)=>(x<0||y<0||x>=w||y>=world.h)?-1:flow[y*w+x];
 const cur=at(tx,ty);if(cur<0)return[dx/dd,dy/dd];
 let best=cur,bx=0,by=0;
 for(let oy=-1;oy<=1;oy++)for(let ox=-1;ox<=1;ox++){if(!ox&&!oy)continue;if(ox&&oy&&(solidT(tget(tx+ox,ty))||solidT(tget(tx,ty+oy))))continue;const v=at(tx+ox,ty+oy);if(v>=0&&v<best){best=v;bx=ox;by=oy;}}
 if(!bx&&!by)return[dx/dd,dy/dd];
 const gx=(tx+bx)*TS+8-cx,gy=(ty+by)*TS+8-cy,gl=Math.hypot(gx,gy)||1;return[gx/gl,gy/gl];
}

 if(ex<0||ex>W||ey<0||ey>H){const ax=clamp(ex,16,W-16),ay=clamp(ey,26,H-30),a=Math.atan2(ey-ay,ex-ax);ctx.fillStyle=(G.t*3|0)%2?'#6dff4a':'#2a7d14';ctx.beginPath();ctx.moveTo(ax+Math.cos(a)*7,ay+Math.sin(a)*7);ctx.lineTo(ax+Math.cos(a+2.4)*5,ay+Math.sin(a+2.4)*5);ctx.lineTo(ax+Math.cos(a-2.4)*5,ay+Math.sin(a-2.4)*5);ctx.fill();text('SALIDA',ax,ay+7,'#6dff4a',1,'center');}
 if(G.state==='play'&&P.alive){const mx=Math.round(mouse.x),my=Math.round(mouse.y),g=P.mflash>0?4:3;ctx.fillStyle=P.weapon?WPN[P.weapon].c:'#7dff3a';ctx.fillRect(mx-g-3,my,3,1);ctx.fillRect(mx+g+1,my,3,1);ctx.fillRect(mx,my-g-3,1,3);ctx.fillRect(mx,my+g+1,1,3);ctx.fillRect(mx,my,1,1);}
}
function staticNoise(){const id=sctx.createImageData(statC.width,statC.height),d=id.data;for(let i=0;i<d.length;i+=4){const v=Math.random()*255|0;d[i]=d[i+1]=d[i+2]=v;d[i+3]=255;}sctx.putImageData(id,0,0);}
function drawTrans(){
 const t=G.transT,a=t<0.75?t/0.75:Math.max(0,1-(t-0.75)/0.95);
 for(let i=0;i<8;i++){const y=Math.random()*H|0,h=rint(2,12),o=Math.round(rand(-30,30)*a);ctx.drawImage(game,0,y,W,h,o,y,W,h);}
 staticNoise();ctx.globalAlpha=a*0.85;ctx.imageSmoothingEnabled=false;ctx.drawImage(statC,0,0,W,H);ctx.globalAlpha=a*0.5;ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;
 if(t>0.3&&t<1.5){text(G.transSw?'SECTOR '+G.sector:'EXTRACCION EN CURSO',W/2,H/2-14,'#7dff3a',2,'center');if(G.transSw)text(TH.name,W/2,H/2+2,TH.hud,1,'center');text('BONUS DE SECTOR +'+G.bonus,W/2,H/2+14,'#ffd23a',1,'center');}
}
const STARS=Array.from({length:110},()=>({x:Math.random()*W,y:Math.random()*H,z:Math.random()}));
const SHIPS=[{x:60,y:40,s:1},{x:300,y:70,s:0.7},{x:200,y:20,s:0.5}];
function drawTitle(){
 ctx.fillStyle='#03030a';ctx.fillRect(0,0,W,H);
 for(const s of STARS){s.x-=s.z*8/60;if(s.x<0)s.x+=W;ctx.fillStyle=s.z>0.7?'#fff':s.z>0.4?'#99a':'#446';ctx.fillRect(s.x|0,s.y|0,1,1);}
 ctx.fillStyle='#0d2a5a';ctx.beginPath();ctx.arc(W/2,H+260,330,0,Math.PI*2);ctx.fill();
 ctx.save();ctx.beginPath();ctx.arc(W/2,H+260,330,0,Math.PI*2);ctx.clip();ctx.fillStyle='#1d4a26';for(let i=0;i<9;i++){const x=(hash(i,1)*W+G.t*4)%(W+80)-40,y=H-70+hash(i,2)*70;ctx.fillRect(x|0,y|0,30+hash(i,3)*50|0,8+hash(i,4)*12|0);}ctx.restore();
 ctx.strokeStyle='#4f8fff';ctx.lineWidth=1;ctx.beginPath();ctx.arc(W/2,H+260,330,Math.PI*1.2,Math.PI*1.8);ctx.stroke();
 for(const s of SHIPS){const x=Math.round(s.x+Math.sin(G.t*0.6+s.y)*20),y=Math.round(s.y+Math.sin(G.t*1.3+s.x)*4);const w=Math.round(30*s.s);
  ctx.fillStyle='rgba(109,255,74,0.08)';ctx.beginPath();ctx.moveTo(x-w/4,y+3);ctx.lineTo(x+w/4,y+3);ctx.lineTo(x+w*0.9,H);ctx.lineTo(x-w*0.9,H);ctx.fill();
  ctx.fillStyle='#3a1650';ctx.fillRect(x-w/2|0,y,w,Math.max(2,4*s.s|0));ctx.fillStyle='#8c3fb8';ctx.fillRect(x-w/4|0,y-Math.max(2,4*s.s|0),w/2|0,Math.max(2,4*s.s|0));
  for(let i=0;i<4;i++){ctx.fillStyle=((G.t*6|0)+i)%4===0?'#7dff3a':'#2a7d14';ctx.fillRect((x-w/2+3+i*(w-6)/3)|0,y+1,1,1);}}
 text('XENO',W/2,26,'#7dff3a',7,'center','#0a3a0a');text('MARINE',W/2,66,'#e8f0d0',4,'center','#333');
 text('DEFENSA DE LA TIERRA',W/2,90,'#ffd23a',1,'center');
 const L=[['WASD','MOVERSE'],['RATON + CLIC','APUNTAR Y DISPARAR'],['FLECHAS','APUNTAR Y DISPARAR'],['CLIC DER / G','GRANADA'],['SHIFT / ESPACIO','ESQUIVA'],['1-5 Q RUEDA','CAMBIAR ARMA'],['R','RECARGAR'],['P / M / N','PAUSA / SONIDO / MAPA'],['MANDO','COMPATIBLE']];
 L.forEach((l,i)=>{text(l[0],W/2-6,97+i*7,'#7fe6ff',1,'right');text(l[1],W/2+6,97+i*7,'#c8d0c0',1,'left');});
 G.diffRects=[];const dy=172;text('DIFICULTAD',W/2,dy-8,'#9a9a9a',1,'center');
 DIFFS.forEach((d,i)=>{const x=W/2-84+i*56,sel=i===DFi;ctx.fillStyle=sel?d.c:'#222';ctx.fillRect(x,dy-1,52,11);ctx.fillStyle=sel?'#000':'#111';ctx.fillRect(x+1,dy,50,9);text(d.n,x+26,dy+2,sel?d.c:'#777',1,'center');G.diffRects.push([x,dy-1,52,11]);});
 text(DF.d,W/2,dy+14,DF.c,1,'center');
 if((G.t*2|0)%2)text('CLIC / ENTER PARA DESPLEGAR',W/2,H-11,'#fff',1,'center');
 text('RECORD '+DF.n+' '+G.hi,W-5,5,'#7a8a7a',1,'right');
}
function drawDead(){
 const a=Math.min(1,G.deadT*1.5);ctx.fillStyle=`rgba(0,0,0,${0.65*a})`;ctx.fillRect(0,0,W,H);
 text('CAIDO EN COMBATE',W/2,50,'#ff3a3a',3,'center');
 text('SECTOR ALCANZADO  '+G.sector,W/2,90,'#e8f0d0',1,'center');text('ALIENIGENAS ABATIDOS  '+G.kills,W/2,100,'#e8f0d0',1,'center');text('PUNTUACION  '+G.score,W/2,110,'#ffd23a',1,'center');
 if(G.newHi&&(G.t*3|0)%2)text('¡NUEVO RECORD!',W/2,126,'#7dff3a',2,'center');
 text('DIFICULTAD  '+DF.n,W/2,80,DF.c,1,'center');
 if(G.deadT>1.2&&(G.t*2|0)%2)text('CLIC: VOLVER AL FRENTE   ESC: MENU',W/2,H-30,'#fff',1,'center');
}
const SHOP=[
 {id:'hp',n:'BLINDAJE CORPORAL',d:'+25 DE VIDA MAXIMA',base:60,max:4},
 {id:'arm',n:'PLACAS CERAMICAS',d:'-10% DE DAÑO RECIBIDO',base:80,max:3},
 {id:'mag',n:'CARGADOR AMPLIADO',d:'+10 BALAS POR CARGADOR',base:50,max:3},
 {id:'spd',n:'SERVOMOTORES',d:'+8% DE VELOCIDAD',base:70,max:3},
 {id:'rof',n:'MEJORA DE FUSIL',d:'MAS DISPAROS Y CADENCIA',base:90,max:2},
 {id:'nade',n:'2 GRANADAS',d:'CONSUMIBLE (MAX 9)',base:30,cons:true},
 {id:'med',n:'BOTIQUIN',d:'RESTAURA TODA LA VIDA',base:40,cons:true},
 {id:'ammo',n:'MUNICION ESPECIAL',d:'RECARGA ESCOPETA, PLASMA Y COHETES',base:45,cons:true},
 {id:'go',n:'>> CONTINUAR AL SECTOR',d:'',base:0}];
const shopLvl=it=>it.id==='rof'?P.lvl-1:(P.up[it.id]||0);
const shopCost=it=>it.cons?it.base:it.base*(shopLvl(it)+1);
function shopBuy(i){
 const it=SHOP[i];if(it.id==='go'){G.state='play';G.msgT=3.2;SFX.sw();return;}
 if(!it.cons&&shopLvl(it)>=it.max){G.shopMsg='NIVEL MAXIMO';SFX.deny();return;}
 if(it.id==='nade'&&P.nades>=9||it.id==='med'&&P.hp>=P.max||it.id==='ammo'&&!(P.has[2]||P.has[3]||P.has[4])){G.shopMsg='NO LO NECESITAS';SFX.deny();return;}
 const c=shopCost(it);if(G.cred<c){G.shopMsg='CREDITOS INSUFICIENTES';SFX.deny();return;}
 G.cred-=c;SFX.buy();G.shopMsg='COMPRADO: '+it.n;
 if(!it.cons&&it.id!=='rof')P.up[it.id]=(P.up[it.id]||0)+1;
 switch(it.id){case'hp':P.max+=25;P.hp+=25;break;case'arm':P.armor+=0.1;break;case'mag':P.magMax+=10;P.mag=P.magMax;break;case'spd':P.spdMul+=0.08;break;case'rof':P.lvl++;break;
  case'nade':P.nades=Math.min(9,P.nades+2);break;case'med':P.hp=P.max;break;case'ammo':for(let w=2;w<5;w++)if(P.has[w])P.ammo[w]=Math.min(WPN[w].max,P.ammo[w]+WPN[w].pick);break;}
}
function updateShop(){
 if(pressed['w']||pressed['arrowup']||pressed['padu'])G.shopSel=(G.shopSel+SHOP.length-1)%SHOP.length;
 if(pressed['s']||pressed['arrowdown']||pressed['padd'])G.shopSel=(G.shopSel+1)%SHOP.length;
 const y0=44,hov=Math.floor((mouse.y-y0+2)/13);if(mouse.x>60&&mouse.x<W-60&&hov>=0&&hov<SHOP.length&&aimMode==='mouse'&&G.mouseMoved)G.shopSel=hov;
 if(pressed['enter']||pressed[' ']||pressed['lmb'])shopBuy(G.shopSel);
 if(pressed['escape'])shopBuy(SHOP.length-1);
}
function drawShop(){
 ctx.fillStyle='rgba(0,6,2,0.88)';ctx.fillRect(0,0,W,H);
 text('ARMERIA DE CAMPAÑA',W/2,12,'#7dff3a',2,'center');text('CREDITOS: '+G.cred,W/2,30,'#5aa0ff',1,'center');
 const y0=44;
 SHOP.forEach((it,i)=>{const y=y0+i*13,sel=i===G.shopSel,lv=it.cons||it.id==='go'?-1:shopLvl(it),mx=lv>=0&&lv>=it.max,c=shopCost(it);
  ctx.fillStyle=sel?'#1d3a1d':'rgba(20,30,20,0.6)';ctx.fillRect(62,y-2,W-124,11);if(sel){ctx.fillStyle='#7dff3a';ctx.fillRect(62,y-2,2,11);}
  text(it.n,68,y,it.id==='go'?'#7fe6ff':sel?'#fff':'#a8c0a8');
  if(lv>=0)for(let k=0;k<it.max;k++){ctx.fillStyle=k<lv?'#7dff3a':'#2a3a2a';ctx.fillRect(218+k*6,y,4,5);}
  if(it.id!=='go')text(mx?'MAX':c+' CR',W-68,y,mx?'#777':G.cred>=c?'#ffd23a':'#7a4a3a',1,'right');});
 const it=SHOP[G.shopSel];text(it.d,W/2,y0+SHOP.length*13+4,'#c8d0c0',1,'center');
 if(G.shopMsg)text(G.shopMsg,W/2,y0+SHOP.length*13+14,'#ffd23a',1,'center');
 text('VIDA '+Math.ceil(P.hp)+'/'+P.max+'  GRANADAS '+P.nades+'  ARMADURA '+Math.round(P.armor*100)+'%',W/2,H-10,'#7a8a7a',1,'center');
}
function drawPause(){ctx.fillStyle='rgba(0,0,0,0.6)';ctx.fillRect(0,0,W,H);text('PAUSA',W/2,70,'#7fe6ff',4,'center');text('P / ESC PARA CONTINUAR',W/2,110,'#fff',1,'center');text('M SONIDO: '+(AU.on?'SI':'NO'),W/2,122,'#c8d0c0',1,'center');}
function render(){
 ctx.setTransform(1,0,0,1,0,0);ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1;ctx.imageSmoothingEnabled=false;
 if(G.state==='title'){drawTitle();return;}
 drawWorld();drawHUD();
 if(G.state==='trans')drawTrans();if(G.state==='shop')drawShop();if(G.state==='pause')drawPause();if(G.state==='dead')drawDead();
}

// ===================== CRT (plano) =====================
function buildOverlay(cw,ch,s){
 overlay=mk(cw,ch);const o=overlay.getContext('2d');
 if(s>=2){const sl=mk(1,s),x=sl.getContext('2d');x.fillStyle='rgba(0,0,0,0.42)';x.fillRect(0,s-1,1,1);if(s>=4){x.fillStyle='rgba(0,0,0,0.16)';x.fillRect(0,s-2,1,1);x.fillRect(0,0,1,1);}o.fillStyle=o.createPattern(sl,'repeat');o.fillRect(0,0,cw,ch);}
 if(s>=3){const ap=mk(3,1),x=ap.getContext('2d');x.fillStyle='rgba(255,40,40,0.05)';x.fillRect(0,0,1,1);x.fillStyle='rgba(40,255,40,0.05)';x.fillRect(1,0,1,1);x.fillStyle='rgba(40,40,255,0.05)';x.fillRect(2,0,1,1);o.fillStyle=o.createPattern(ap,'repeat');o.fillRect(0,0,cw,ch);}
 const vg=o.createRadialGradient(cw/2,ch/2,ch*0.4,cw/2,ch/2,Math.hypot(cw,ch)/2);vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,0.5)');o.fillStyle=vg;o.fillRect(0,0,cw,ch);
}
function regenNoise(){const id=nctx.createImageData(128,128),d=id.data;for(let i=0;i<d.length;i+=4){const v=Math.random()*255|0;d[i]=d[i+1]=d[i+2]=v;d[i+3]=255;}nctx.putImageData(id,0,0);}
function post(){
 const cw=scr.width,ch=scr.height;
 [[chR,'#f00'],[chG,'#0f0'],[chB,'#00f']].forEach(([cv,col])=>{const c=cv.getContext('2d');c.globalCompositeOperation='copy';c.drawImage(game,0,0);c.globalCompositeOperation='multiply';c.fillStyle=col;c.fillRect(0,0,W,H);});
 dctx.globalCompositeOperation='source-over';dctx.globalAlpha=1;dctx.fillStyle='#000';dctx.fillRect(0,0,cw,ch);
 dctx.imageSmoothingEnabled=false;dctx.globalCompositeOperation='lighter';
 const o=Math.max(1,Math.round(SC*0.35));
 dctx.drawImage(chR,o,0,cw,ch);dctx.drawImage(chG,0,0,cw,ch);dctx.drawImage(chB,-o,0,cw,ch);
 bctx.globalCompositeOperation='copy';if(FILTER_OK)bctx.filter='brightness(0.75) contrast(2.2) blur(2px)';bctx.drawImage(game,0,0,W/2,H/2);if(FILTER_OK)bctx.filter='none';
 dctx.imageSmoothingEnabled=true;dctx.globalAlpha=FILTER_OK?0.55:0.12;dctx.drawImage(bloomC,0,0,cw,ch);
 dctx.globalAlpha=1;dctx.globalCompositeOperation='source-over';
 dctx.drawImage(overlay,0,0);
 if((G.frame&1)===0)regenNoise();
 dctx.globalAlpha=0.045;dctx.fillStyle=dctx.createPattern(noiseC,'repeat');dctx.fillRect(0,0,cw,ch);
 const by=((G.t*0.18)%1.4-0.2)*ch,gr=dctx.createLinearGradient(0,by,0,by+ch*0.18);gr.addColorStop(0,'rgba(255,255,255,0)');gr.addColorStop(0.5,'rgba(255,255,255,0.5)');gr.addColorStop(1,'rgba(255,255,255,0)');
 dctx.globalAlpha=0.05;dctx.fillStyle=gr;dctx.fillRect(0,by,cw,ch*0.18);
 dctx.globalAlpha=Math.random()*0.025;dctx.fillStyle='#fff';dctx.fillRect(0,0,cw,ch);dctx.globalAlpha=1;
}
function resize(){
 const dpr=window.devicePixelRatio||1,aw=innerWidth*dpr,ah=innerHeight*dpr;
 let s=Math.floor(Math.min(aw/W,ah/H));if(s<1)s=1;SC=s;
 scr.width=W*s;scr.height=H*s;scr.style.width=(W*s/dpr)+'px';scr.style.height=(H*s/dpr)+'px';
 buildOverlay(scr.width,scr.height,s);
}
addEventListener('resize',resize);resize();

// ===================== ENTRADA =====================
const keys={};let pressed={};const mouse={x:W/2,y:H/2,down:false};
addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(!keys[k])pressed[k]=true;keys[k]=true;if([' ','arrowup','arrowdown','arrowleft','arrowright'].includes(k))e.preventDefault();auInit();});
addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false;});
function mpos(e){const r=scr.getBoundingClientRect();mouse.x=clamp((e.clientX-r.left)/r.width*W,0,W-1);mouse.y=clamp((e.clientY-r.top)/r.height*H,0,H-1);}
addEventListener('mousemove',e=>{if(Math.abs(e.movementX||0)+Math.abs(e.movementY||0)>0){aimMode='mouse';G.mouseMoved=true;}mpos(e);});
scr.addEventListener('mousedown',e=>{aimMode='mouse';mpos(e);auInit();if(e.button===0){mouse.down=true;pressed['lmb']=true;}else if(e.button===2)pressed['rmb']=true;e.preventDefault();});
addEventListener('mouseup',e=>{if(e.button===0)mouse.down=false;});
scr.addEventListener('contextmenu',e=>e.preventDefault());
scr.addEventListener('wheel',e=>{if(G.state==='play'&&P)cycleWeapon(e.deltaY>0?1:-1);e.preventDefault();},{passive:false});
addEventListener('blur',()=>{mouse.down=false;for(const k in keys)keys[k]=false;if(G.state==='play'){G.state='pause';setFlame(false);}});

// ===================== BUCLE =====================
let last=performance.now();
function update(dt){
 pollPad();
 G.t+=dt;G.frame++;G.shake=Math.max(0,G.shake-dt*22);G.hurtFlash=Math.max(0,G.hurtFlash-dt);
 if(pressed['m'])toggleMute();if(pressed['n'])G.noMap=!G.noMap;
 switch(G.state){
  case'title':{
   if(pressed['arrowleft']||pressed['a']||pressed['padl'])setDiff(DFi-1);if(pressed['arrowright']||pressed['d']||pressed['padr'])setDiff(DFi+1);
   if(pressed['1'])setDiff(0);if(pressed['2'])setDiff(1);if(pressed['3'])setDiff(2);
   let hit=-1;if(pressed['lmb']&&G.diffRects)G.diffRects.forEach((r,i)=>{if(mouse.x>=r[0]&&mouse.x<r[0]+r[2]&&mouse.y>=r[1]-3&&mouse.y<r[1]+r[3]+3)hit=i;});
   if(hit>=0){setDiff(hit);SFX.sw();}else if(pressed['lmb']||pressed['enter']||pressed[' '])startGame();break;}
  case'play':if(pressed['escape']||pressed['p']){G.state='pause';setFlame(false);break;}updateGame(dt);break;
  case'pause':if(pressed['escape']||pressed['p'])G.state='play';break;
  case'trans':updateTrans(dt);break;
  case'shop':updateShop();break;
  case'dead':G.deadT+=dt;updateParts(dt);updateEnemies(dt);if(G.deadT>1.2&&(pressed['lmb']||pressed['enter']||pressed[' ']))startGame();else if(G.deadT>1.2&&(pressed['escape']||pressed['p']))G.state='title';break;
 }
}
function frame(now){
 const dt=Math.min(0.033,(now-last)/1000);last=now;
 update(dt);render();post();pressed={};
 requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
window.__XM={get SHOP(){return SHOP;},shopBuy,G,get P(){return P;},get world(){return world;},get enemies(){return enemies;},startGame,nextSection,update,render};
})();
