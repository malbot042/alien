const AU={ctx:null,on:true,flameG:null,hitT:0};
function auInit(){

 const comp=a.createDynamicsCompressor();comp.connect(AU.master);
 AU.sfx=a.createGain();AU.sfx.gain.value=0.9;AU.sfx.connect(comp);
 AU.mus=a.createGain();AU.mus.gain.value=0.2;AU.mus.connect(comp);
 const len=a.sampleRate;AU.nb=a.createBuffer(1,len,a.sampleRate);const d=AU.nb.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
 const s=a.createBufferSource();s.buffer=AU.nb;s.loop=true;const f=a.createBiquadFilter();f.type='bandpass';f.frequency.value=420;f.Q.value=0.6;const g=a.createGain();g.gain.value=0;s.connect(f);f.connect(g);g.connect(AU.sfx);s.start();AU.flameG=g;
 startMusic();
}
function nz(dur,f0,f1,type,vol,q=1,delay=0){const a=AU.ctx;if(!a)return;const t=a.currentTime+delay;const s=a.createBufferSource();s.buffer=AU.nb;const f=a.createBiquadFilter();f.type=type;f.Q.value=q;f.frequency.setValueAtTime(f0,t);f.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t+dur);const g=a.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.001,t+dur);s.connect(f);f.connect(g);g.connect(AU.sfx);s.start(t,Math.random()*0.5);s.stop(t+dur+0.05);}
function tn(type,f0,f1,dur,vol,delay=0){const a=AU.ctx;if(!a)return;const t=a.currentTime+delay;const o=a.createOscillator();o.type=type;o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t+dur);const g=a.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.001,t+dur);o.connect(g);g.connect(AU.sfx);o.start(t);o.stop(t+dur+0.05);}

 const note=(type,f,t,dur,vol,lp)=>{const o=a.createOscillator();o.type=type;o.frequency.value=f;const fl=a.createBiquadFilter();fl.type='lowpass';fl.frequency.value=lp;const g=a.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.001,t+dur);o.connect(fl);fl.connect(g);g.connect(AU.mus);o.start(t);o.stop(t+dur+0.02);};

function makeWorld(mode,w,h){const d=mk(w*TS,h*TS);return{mode,w,h,t:new Uint8Array(w*h),crateHp:new Map(),decal:d,dctx:d.getContext('2d'),exit:null};}
function tget(tx,ty){if(tx<0||tx>=world.w||ty<0)return T.WALL;if(ty>=world.h)return world.mode==='top'?T.WALL:T.EMPTY;return world.t[ty*world.w+tx];}
const solidT=v=>v===T.WALL||v===T.CRATE;
const solidAt=(x,y)=>solidT(tget(Math.floor(x/TS),Math.floor(y/TS)));
function hitSolid(x,y,w,h){const x0=Math.floor(x/TS),x1=Math.floor((x+w-0.01)/TS),y0=Math.floor(y/TS),y1=Math.floor((y+h-0.01)/TS);for(let ty=y0;ty<=y1;ty++)for(let tx=x0;tx<=x1;tx++)if(solidT(tget(tx,ty)))return true;return false;}
function overlapType(e,type){const x0=Math.floor(e.x/TS),x1=Math.floor((e.x+e.w-0.01)/TS),y0=Math.floor(e.y/TS),y1=Math.floor((e.y+e.h-0.01)/TS);for(let ty=y0;ty<=y1;ty++)for(let tx=x0;tx<=x1;tx++)if(tget(tx,ty)===type)return true;return false;}
function moveBox(e,dx,dy,drop){
 const r={hx:false,hy:false,ground:false};
 const n=Math.max(1,Math.ceil(Math.max(Math.abs(dx),Math.abs(dy))/6)),sx=dx/n,sy=dy/n,plat=world.mode==='plat';
 for(let i=0;i<n;i++){
  if(sx){e.x+=sx;if(hitSolid(e.x,e.y,e.w,e.h)){if(sx>0)e.x=Math.floor((e.x+e.w-0.01)/TS)*TS-e.w;else e.x=(Math.floor(e.x/TS)+1)*TS;r.hx=true;}}
  if(sy){const pb=e.y+e.h;e.y+=sy;
   if(hitSolid(e.x,e.y,e.w,e.h)){if(sy>0){e.y=Math.floor((e.y+e.h-0.01)/TS)*TS-e.h;r.ground=true;}else e.y=(Math.floor(e.y/TS)+1)*TS;r.hy=true;}
   else if(plat&&sy>0&&!drop){const row=Math.floor((e.y+e.h-0.01)/TS);if(pb<=row*TS+0.01){const x0=Math.floor(e.x/TS),x1=Math.floor((e.x+e.w-0.01)/TS);for(let tx=x0;tx<=x1;tx++)if(tget(tx,row)===T.PLAT){e.y=row*TS-e.h;r.ground=true;r.hy=true;break;}}}}
 }
 return r;
}
function los(x0,y0,x1,y1){const d=Math.hypot(x1-x0,y1-y0),n=Math.ceil(d/6);for(let i=1;i<n;i++){const t=i/n;if(solidAt(x0+(x1-x0)*t,y0+(y1-y0)*t))return false;}return true;}

function genTop(seed){
 const R=mulberry(seed),w=30,h=Math.min(120+G.sector*12,220);
 world=makeWorld('top',w,h);const t=world.t;
 const S=(x,y,v)=>{if(x>0&&x<w-1&&y>1&&y<h-1)t[y*w+x]=v;},Gt=(x,y)=>t[y*w+x];
 for(let y=0;y<h;y++)for(let x=0;x<w;x++)t[y*w+x]=(x===0||x===w-1||y<2||y===h-1)?T.WALL:T.EMPTY;
 const kc=new Int16Array(h);let cx=w>>1,dr=0;
 for(let y=h-1;y>=0;y--){if(R()<0.12)dr=(R()*3|0)-1;if(y%2===0)cx=clamp(cx+dr,5,w-6);if(cx===5||cx===w-6)dr=-dr;kc[y]=cx;}
 const keep=(x,y)=>y<0||y>=h||Math.abs(x-kc[y])<=3;
 for(let i=0;i<h/7;i++){const rw=4+R()*7|0,rh=4+R()*6|0,rx=1+R()*(w-rw-2)|0,ry=10+R()*(h-rh-22)|0;
  for(let y=ry;y<ry+rh;y++)for(let x=rx;x<rx+rw;x++){const edge=y===ry||y===ry+rh-1||x===rx||x===rx+rw-1;if(edge&&!keep(x,y)&&R()>0.15)S(x,y,T.WALL);}}
 for(let i=0;i<h*0.7;i++){const bw=1+R()*3|0,bh=1+R()*2|0,bx=1+R()*(w-bw-2)|0,by=10+R()*(h-22)|0;for(let y=by;y<by+bh;y++)for(let x=bx;x<bx+bw;x++)if(!keep(x,y))S(x,y,T.WALL);}
 for(let i=0;i<3+G.sector;i++){const ax=2+R()*(w-4)|0,ay=14+R()*(h-30)|0,r=1+R()*1.8;for(let y=ay-2;y<=ay+2;y++)for(let x=ax-2;x<=ax+2;x++)if(y>1&&y<h-1&&Math.hypot(x-ax,y-ay)<=r&&Gt(x,y)===T.EMPTY&&!keep(x,y))S(x,y,T.ACID);}
 for(let y=10;y<h-10;y++)for(let x=1;x<w-1;x++)if(Gt(x,y)===T.EMPTY&&R()<(keep(x,y)?0.006:0.03))S(x,y,T.CRATE);
 for(let i=0;i<h/18;i++){const ax=2+R()*(w-4)|0,ay=12+R()*(h-30)|0;for(let y=ay-2;y<=ay+2;y++)for(let x=ax-3;x<=ax+3;x++)if(y>1&&y<h-1&&x>0&&x<w-1&&Gt(x,y)===T.EMPTY&&R()<0.6)S(x,y,T.CREEP);}
 const nn=Math.min(2+G.sector,9);
 for(let i=0;i<nn;i++)for(let tries=0;tries<30;tries++){const x=2+R()*(w-4)|0,y=16+R()*(h-36)|0;const v=Gt(x,y);if(v!==T.EMPTY&&v!==T.CREEP)continue;
  for(let yy=y-3;yy<=y+3;yy++)for(let xx=x-3;xx<=x+3;xx++)if(yy>1&&yy<h-1&&xx>0&&xx<w-1&&Gt(xx,yy)===T.EMPTY&&Math.hypot(xx-x,yy-y)<3.2&&R()<.85)S(xx,yy,T.CREEP);
  spawnEnemy('nest',x*TS+8,y*TS+8,true);break;}
 const ex=kc[3];
 for(let y=2;y<=8;y++)for(let x=ex-4;x<=ex+4;x++)S(x,y,T.EMPTY);
 for(let y=3;y<=4;y++)for(let x=ex-1;x<=ex+1;x++)S(x,y,T.EXIT);
 world.exit={x:(ex-1)*TS,y:3*TS,w:48,h:32};
 for(let y=h-9;y<h-1;y++)for(let x=1;x<w-1;x++)S(x,y,T.EMPTY);
 placePlayer(kc[h-4]*TS+8,(h-4)*TS+8);
 const ne=8+G.sector*3;
 for(let i=0;i<ne;i++)for(let tries=0;tries<20;tries++){const x=1+R()*(w-2)|0,y=12+R()*(h-36)|0;const v=Gt(x,y);if(v!==T.EMPTY&&v!==T.CREEP)continue;spawnEnemy(randType(R),x*TS+8,y*TS+8,true);break;}
 for(let i=0;i<5;i++)for(let tries=0;tries<20;tries++){const x=1+R()*(w-2)|0,y=12+R()*(h-30)|0;if(Gt(x,y)!==T.EMPTY)continue;pickups.push({type:['med','fuel','nade','fuel','med'][i],x:x*TS+8,y:y*TS+8,vy:0,t:R()*9});break;}
}

// ---------- Generación: COLMENA (plataformas) ----------
function genPlat(seed){
 const R=mulberry(seed),w=Math.min(170+G.sector*20,300),h=18;
 world=makeWorld('plat',w,h);const t=world.t;
 const S=(x,y,v)=>{if(x>=0&&x<w&&y>=0&&y<h)t[y*w+x]=v;},Gt=(x,y)=>t[y*w+x];
 const gh=new Int16Array(w).fill(-1),plats=[];let g=12,x=0;
 const flat=n=>{for(let i=0;i<n&&x<w;i++)gh[x++]=g;};
 flat(12);
 while(x<w-18){const r=R();
  if(r<0.3)flat(3+R()*6|0);
  else if(r<0.55){g=clamp(g+(R()<0.5?-1:1)*(1+(R()<0.4?1:0)),8,14);flat(3+R()*4|0);}
  else if(r<0.75){const big=R()<0.45,n=big?5+(R()*2|0):2+(R()*2|0),sx=x;for(let i=0;i<n;i++)gh[x++]=-1;if(big)plats.push([sx+((n-2)/2|0),g-1,2]);flat(2);}
  else{const n=7+R()*6|0,sx=x;flat(n);plats.push([sx+1+(R()*2|0),g-3,3+(R()*2|0)]);if(g>=12&&R()<0.6)plats.push([sx+3+(R()*2|0),g-6,3]);}
 }
 while(x<w)gh[x++]=g;
 const top=new Int16Array(w);for(let i=0;i<w;i++)top[i]=gh[i]>=0?gh[i]:h-3;
 plats.forEach(([px,py,len])=>{for(let i=0;i<len;i++)if(px+i<w)top[px+i]=Math.min(top[px+i],py);});
 const ch=new Int16Array(w);let c=2;
 for(let i=0;i<w;i++){if(R()<0.2)c=clamp(c+(R()<.5?-1:1),1,4);let tm=99;for(let j=i-2;j<=i+2;j++)if(j>=0&&j<w)tm=Math.min(tm,top[j]);ch[i]=Math.max(0,Math.min(c,tm-6));if(R()<0.12&&ch[i]+2<=tm-6)ch[i]+=1+(R()*2|0);}
 for(let i=0;i<w;i++){for(let y=0;y<=ch[i];y++)S(i,y,T.WALL);if(gh[i]>=0){for(let y=gh[i];y<h;y++)S(i,y,T.WALL);}else{S(i,h-3,T.ACID);S(i,h-2,T.ACID);S(i,h-1,T.WALL);}}
 plats.forEach(([px,py,len])=>{for(let i=0;i<len;i++)if(px+i<w&&Gt(px+i,py)===T.EMPTY)S(px+i,py,T.PLAT);});
 for(let i=15;i<w-18;i++)if(gh[i]>=0&&gh[i-1]===gh[i]&&gh[i+1]===gh[i]&&R()<0.04&&Gt(i,gh[i]-1)===T.EMPTY)S(i,gh[i]-1,T.CRATE);
 for(let y=0;y<h;y++)S(w-1,y,T.WALL);
 const ex=w-7,eg=gh[ex];
 for(let y=eg-3;y<eg;y++)for(let i=ex;i<ex+3;i++)S(i,y,T.EXIT);
 world.exit={x:ex*TS,y:(eg-3)*TS,w:48,h:48};
 placePlayer(4*TS,12*TS-10);
 for(let i=22;i<w-16;i++){
  if(gh[i]<0||Gt(i,gh[i]-1)!==T.EMPTY)continue;const px=i*TS+8,sy=gh[i]*TS,r=R();
  if(r<0.035+0.008*G.sector)spawnGround('crawler',px,sy,true);
  else if(r<0.05+0.01*G.sector)spawnGround('spitter',px,sy,true);
  else if(r<0.058+0.003*G.sector)spawnGround('nest',px,sy,true);
  else if(G.sector>=2&&r<0.066+0.004*G.sector)spawnGround('brute',px,sy,true);
  if(R()<0.015)spawnEnemy('flyer',px,(ch[i]+3)*TS,true);
 }
 plats.forEach(([px,py,len])=>{if(px>18&&px<w-16&&R()<0.4)spawnGround('spitter',(px+1)*TS+8,py*TS,true);});
 for(let i=0;i<4;i++){const xx=30+R()*(w-50)|0;if(gh[xx]>=0)pickups.push({type:['med','fuel','nade','med'][i],x:xx*TS+8,y:gh[xx]*TS-30,vy:0,t:0});}
}

const EDEF={
 crawler:{hp:22,spd:74,dmg:8,score:100,tw:10,th:10,pw:12,ph:9},
 spitter:{hp:40,spd:34,dmg:12,score:200,tw:12,th:12,pw:12,ph:15},
 brute:{hp:170,spd:36,dmg:22,score:500,tw:16,th:16,pw:16,ph:18},

};
function eSize(type){const d=EDEF[type],p=world.mode==='plat';return[p?d.pw:d.tw,p?d.ph:d.th];}
function spawnEnemy(type,cx,cy,sleep){const d=EDEF[type],[w,h]=eSize(type);const e={type,x:cx-w/2,y:cy-h/2,w,h,vx:0,vy:0,hp:d.hp*G.diff,max:d.hp*G.diff,t:Math.random()*9,cd:rand(0.5,2),atk:0,flash:0,burn:0,face:-1,sleep:!!sleep,ang:Math.PI/2,ground:false,chg:0,cdx:0,cdy:0,dive:0,seed:Math.random(),dead:false};enemies.push(e);return e;}
function spawnGround(type,cx,surfY,sleep){const h=eSize(type)[1];return spawnEnemy(type,cx,surfY-h/2-0.01,sleep);}
function randType(R=Math.random){const r=R();if(G.sector>=2&&r<Math.min(0.2,0.04+0.02*G.sector))return'brute';if(r<0.32)return'spitter';return'crawler';}

function newPlayer(){P={x:0,y:0,w:10,h:10,vx:0,vy:0,hp:100,max:100,weapon:0,mag:40,reload:0,cd:0,fuel:100,nades:4,lvl:1,inv:0,face:1,aim:0,ground:false,coyote:0,jbuf:0,drop:0,anim:0,ncd:0,safeX:0,safeY:0,alive:true,acidT:0,mflash:0,flameAcc:0,deathT:0,flaming:false};}
function placePlayer(cx,cy){const plat=world.mode==='plat';P.w=10;P.h=plat?20:10;P.x=cx-P.w/2;P.y=cy-P.h/2;P.vx=P.vy=0;P.safeX=P.x;P.safeY=P.y;P.ground=false;}

function computeFlow(){
 const w=world.w,h=world.h,N=w*h;if(!flow||flow.length!==N){flow=new Int16Array(N);flowQ=new Int32Array(N);}flow.fill(-1);
 const px=clamp(Math.floor((P.x+P.w/2)/TS),0,w-1),py=clamp(Math.floor((P.y+P.h/2)/TS),0,h-1),q=flowQ,t=world.t;
 let hd=0,tl=0;flow[py*w+px]=0;q[tl++]=py*w+px;
 while(hd<tl){const i=q[hd++],d=flow[i];if(d>=60)continue;const x=i%w,nd=d+1;let j;
  if(x>0){j=i-1;if(flow[j]<0&&!solidT(t[j])){flow[j]=nd;q[tl++]=j;}}
  if(x<w-1){j=i+1;if(flow[j]<0&&!solidT(t[j])){flow[j]=nd;q[tl++]=j;}}
  if(i>=w){j=i-w;if(flow[j]<0&&!solidT(t[j])){flow[j]=nd;q[tl++]=j;}}
  if(i<N-w){j=i+w;if(flow[j]<0&&!solidT(t[j])){flow[j]=nd;q[tl++]=j;}}}
}
function pathDir(e,dx,dy,dd){
 const cx=e.x+e.w/2,cy=e.y+e.h/2;
 if(dd<36||!flow||(dd<100&&los(cx,cy,cx+dx,cy+dy)))return[dx/dd,dy/dd];
 const w=world.w,tx=Math.floor(cx/TS),ty=Math.floor(cy/TS);
 const at=(x,y)=>(x<0||y<0||x>=w||y>=world.h)?-1:flow[y*w+x];
 const cur=at(tx,ty);if(cur<0)return[dx/dd,dy/dd];
 let best=cur,bx=0,by=0;
 for(let oy=-1;oy<=1;oy++)for(let ox=-1;ox<=1;ox++){if(!ox&&!oy)continue;if(ox&&oy&&(solidT(tget(tx+ox,ty))||solidT(tget(tx,ty+oy))))continue;const v=at(tx+ox,ty+oy);if(v>=0&&v<best){best=v;bx=ox;by=oy;}}
 if(!bx&&!by)return[dx/dd,dy/dd];
 const gx=(tx+bx)*TS+8-cx,gy=(ty+by)*TS+8-cy,gl=Math.hypot(gx,gy)||1;return[gx/gl,gy/gl];
}

function damageEnemy(e,a,kx,ky,silent){if(e.dead)return;e.hp-=a;if(!silent){e.flash=0.07;SFX.hit();}e.sleep=false;if(kx||ky){e.vx+=kx;e.vy+=ky;}if(e.hp<=0)killEnemy(e);}
function killEnemy(e,noScore){
 if(e.dead)return;e.dead=true;const d=EDEF[e.type],cx=e.x+e.w/2,cy=e.y+e.h/2,plat=world.mode==='plat';
 if(!noScore){const pts=Math.round(d.score*(1+0.5*(G.sector-1)));G.score+=pts;popup(cx,cy-8,'+'+pts,'#ffd23a');G.kills++;}

function updateEnemies(dt){
 const plat=world.mode==='plat',pcx=P.x+P.w/2,pcy=P.y+P.h/2;
 for(const e of enemies){
  if(e.dead)continue;

  const cx=e.x+e.w/2,cy=e.y+e.h/2,dx=pcx-cx,dy=pcy-cy,dist=Math.hypot(dx,dy)||1;
  if(e.sleep){if(P.alive&&(plat?Math.abs(dx)<230&&Math.abs(dy)<170:dist<175)){e.sleep=false;if(e.type!=='nest'&&Math.random()<0.5)SFX.screech();}else continue;}
  if(e.burn>0){e.burn-=dt;damageEnemy(e,12*dt,0,0,true);if(Math.random()<dt*25)parts.push({x:cx+rand(-4,4),y:cy+rand(-4,4),vx:rand(-10,10),vy:rand(-40,-10),life:0.3,max:0.3,c:pick(['#ffc040','#ff6a1a']),sz:2,glow:true});if(e.dead)continue;}
  if(plat)ePlat(e,dt,pcx,pcy,dx,dy,dist);else eTop(e,dt,pcx,pcy,dx,dy,dist);
  if(e.dead)continue;
  if(P.alive&&e.type!=='nest'&&e.atk<=0&&e.x<P.x+P.w-1&&e.x+e.w>P.x+1&&e.y<P.y+P.h-1&&e.y+e.h>P.y+1){hurt(EDEF[e.type].dmg,cx,cy);e.atk=0.75;if(e.type==='flyer'){e.vy=-140;e.vx=-Math.sign(dx)*80;}}
 }
 if(!plat){
  for(let i=0;i<enemies.length;i++){const a=enemies[i];if(a.dead||a.type==='nest'||a.sleep)continue;
   for(let j=i+1;j<enemies.length;j++){const b=enemies[j];if(b.dead||b.type==='nest'||b.sleep)continue;
    const dx=(b.x+b.w/2)-(a.x+a.w/2),dy=(b.y+b.h/2)-(a.y+a.h/2),mn=(a.w+b.w)*0.45,d2=dx*dx+dy*dy;
    if(d2<mn*mn&&d2>0.01){const d=Math.sqrt(d2),p=(mn-d)*0.5,nx=dx/d,ny=dy/d;moveBox(a,-nx*p,-ny*p,false);moveBox(b,nx*p,ny*p,false);}}}

function eTop(e,dt,pcx,pcy,dx,dy,dist){

  e.face=dir;if(e.ground)e.vx=approach(e.vx,Math.sin(e.t*0.8+e.seed*5)*12,300*dt);

 const by=((G.t*0.18)%1.4-0.2)*ch,gr=dctx.createLinearGradient(0,by,0,by+ch*0.18);gr.addColorStop(0,'rgba(255,255,255,0)');gr.addColorStop(0.5,'rgba(255,255,255,0.5)');gr.addColorStop(1,'rgba(255,255,255,0)');
 dctx.globalAlpha=0.05;dctx.fillStyle=gr;dctx.fillRect(0,by,cw,ch*0.18);
 dctx.globalAlpha=Math.random()*0.025;dctx.fillStyle='#fff';dctx.fillRect(0,0,cw,ch);dctx.globalAlpha=1;
}
function resize(){
 const dpr=window.devicePixelRatio||1,aw=innerWidth*dpr,ah=innerHeight*dpr;
 let s=Math.floor(Math.min(aw/W,ah/H));if(s<1)s=1;SC=s;
 scr.width=W*s;scr.height=H*s;scr.style.width=(W*s/dpr)+'px';scr.style.height=(H*s/dpr)+'px';
 buildOverlay(scr.width,scr.height,s);
}
addEventListener('resize',resize);resize();

// ===================== ENTRADA =====================
const keys={};let pressed={};const mouse={x:W/2,y:H/2,down:false};
addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(!keys[k])pressed[k]=true;keys[k]=true;if([' ','arrowup','arrowdown','arrowleft','arrowright'].includes(k))e.preventDefault();auInit();});
addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false;});
function mpos(e){const r=scr.getBoundingClientRect();mouse.x=clamp((e.clientX-r.left)/r.width*W,0,W-1);mouse.y=clamp((e.clientY-r.top)/r.height*H,0,H-1);}
addEventListener('mousemove',mpos);
scr.addEventListener('mousedown',e=>{mpos(e);auInit();if(e.button===0){mouse.down=true;pressed['lmb']=true;}else if(e.button===2)pressed['rmb']=true;e.preventDefault();});
addEventListener('mouseup',e=>{if(e.button===0)mouse.down=false;});
scr.addEventListener('contextmenu',e=>e.preventDefault());
scr.addEventListener('wheel',e=>{if(G.state==='play'&&P)setWeapon(1-P.weapon);e.preventDefault();},{passive:false});
addEventListener('blur',()=>{mouse.down=false;for(const k in keys)keys[k]=false;if(G.state==='play'){G.state='pause';setFlame(false);}});

// ===================== BUCLE =====================
let last=performance.now();
function update(dt){
 G.t+=dt;G.frame++;G.shake=Math.max(0,G.shake-dt*22);G.hurtFlash=Math.max(0,G.hurtFlash-dt);
 if(pressed['m'])toggleMute();
 switch(G.state){
  case'title':if(pressed['lmb']||pressed['enter']||pressed[' '])startGame();break;
  case'play':if(pressed['escape']||pressed['p']){G.state='pause';setFlame(false);break;}updateGame(dt);break;
  case'pause':if(pressed['escape']||pressed['p'])G.state='play';break;
  case'trans':updateTrans(dt);break;
  case'dead':G.deadT+=dt;updateParts(dt);updateEnemies(dt);if(G.deadT>1.2&&(pressed['lmb']||pressed['enter']))startGame();break;
 }
}
function frame(now){
 const dt=Math.min(0.033,(now-last)/1000);last=now;
 update(dt);render();post();pressed={};
 requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
window.__XM={G,get P(){return P;},get world(){return world;},get enemies(){return enemies;},startGame,nextSection,update,render};
})();
</script>
